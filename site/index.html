['Spaced recall','Who first measured the "forgetting curve" by testing himself on nonsense syllables?','Hermann Ebbinghaus','Sigmund Freud of Vienna','Ivan Petrovich Pavlov','Ebbinghaus published Memory in 1885. He found most forgetting happens soon after learning, then slows.',['Forgetting curve','Hermann Ebbinghaus']],

['Spaced recall','Roediger and Karpicke (2006) found that, compared with rereading, practice testing leads to what?','Better recall a week later','Worse recall a week later','The same recall either way','This is the testing effect, or retrieval practice. Trying to recall strengthens memory more than reading again.',['Testing effect']],
['Spaced recall','In the Leitner box system, what happens to a card you get wrong?','It goes back to box 1','It moves up one box higher','It is removed forever from the deck','Sebastian Leitner described it in 1972. Easy cards are seen less often and hard cards more often. This app uses it.',['Leitner system']],
['Memory palace','The method of loci (memory palace) is linked by legend to which Greek poet?','Simonides of Ceos','Homer, the poet of the Iliad','Pindar of Thebes, the poet','Cicero tells the story: after a banquet hall collapsed, Simonides named the dead by remembering where each guest sat.',['Method of loci','Simonides of Ceos']],
['Memory palace','In a memory palace, where do you "put" the things you want to remember?','Along a familiar route','In alphabetical order','On a blank page','You picture each item, in a vivid way, at a place along a path you know well, like rooms in your home.',['Method of loci']],
['Memory palace','Dresler and others (2017) trained ordinary people in the method of loci for 40 days. What happened?','Word list recall more than doubled','Recall did not change at all','IQ scores went up 30 points','Recall went from about 26 to about 62 words out of 72 and lasted months. The gain was for remembering lists (near transfer), not IQ.',['Method of loci']],
['Digit span','Classic research (Miller, 1956) put short-term memory span at about how many items?','Seven, plus or minus two','Two, plus or minus one','Twenty five, plus or minus five','Later work by Nelson Cowan (2001) suggests about four chunks when people cannot rehearse or group items.',['The Magical Number Seven, Plus or Minus Two']],
['Digit span','After 230 hours of practice, a runner called "SF" raised his digit span from 7 to about 79. What about his span for letters?','It stayed about 6','It also rose to about 79 letters','It dropped to 2','Ericsson, Chase and Faloon (1980). He grouped digits as running times. The skill did not carry over to letters. This is near transfer.',['Memory span']],
['Digit span','What is "chunking"?','Grouping items into bigger units','Repeating one item many times','Saying items out loud backward','Example: a phone number grouped as 619, 555, 0123 is easier to hold than 10 single digits.',['Chunking (psychology)']],
['N-back','In a 2-back task, when do you tap "Match"?','When it matches the one 2 back','When it matches the one before','When it is a new letter','Wayne Kirchner described n-back tasks in 1958. Researchers use them to test working memory.',['N-back']],
['N-back','A 2013 review (Melby-Lervag and Hulme) of working memory training found what?','Gains mostly on similar tasks','Large gains in general IQ','No gains on any task at all','People improve on the trained task and similar ones (near transfer). There was no convincing evidence of far transfer to IQ or reading.',['N-back','Brain training']],
['N-back','In 2016 the US Federal Trade Commission fined the maker of which brain game for unproven claims?','Lumosity','Tetris by Alexey Pajitnov','Minecraft by Mojang','Lumos Labs paid $2 million to settle claims that its games could delay memory decline and boost school and work performance.',['Lumosity']],
['Spaced recall','What does good sleep after learning do for memory?','Helps memories set and last','Erases what you learned that day','Has no effect','Studies reviewed by Diekelmann and Born (2010) show sleep helps consolidate new memories.',['Sleep and memory']]
];
MG.decks.memory = { id: 'memory', title: 'Memory Trainers', min: 12, note: 'What the research really says about memory training. Practice makes you better at what you practice (near transfer). Claims that brain games raise general intelligence are not well supported (Simons and others, 2016).', sets: ['Spaced recall', 'Memory palace', 'Digit span', 'N-back'],
  cards: C.map(function (a, i) { return { id: 'm' + (i + 1), set: a[0], q: a[1], a: a[2], w: [a[3], a[4]], why: a[5], src: a[6].map(W) }; }) };
MG.palace = { places: ['Front door', 'Welcome mat', 'Coat hook', 'Couch', 'TV', 'Kitchen table', 'Fridge', 'Kitchen sink'],
  items: ['Eggs', 'Bread', 'Apples', 'Soap', 'Batteries', 'Rice', 'Milk', 'Tape', 'Onions', 'Nails', 'Honey', 'Socks'] };
})();
if (typeof module !== 'undefined') module.exports = MG;

<script data-src="decks/survival.js">
// Survival science and town-building deck data only. [set, question, answer, wrong1, wrong2, why, [sources]].
// Sources: Wikipedia articles (which cite WHO, CAWST, Sphere, EPA, FAO and engineering texts) plus direct agency pages.
// Dangerous chemistry appears only as recognize-and-avoid safety cards. No weapon or poison steps.
var MG = typeof MG !== 'undefined' ? MG : {}; MG.decks = MG.decks || {};
(function () {
var W = function (t) { return 'https://en.wikipedia.org/wiki/' + encodeURIComponent(t.replace(/ /g, '_')); };
var EPA = 'https://www.epa.gov/ground-water-and-drinking-water/emergency-disinfection-drinking-water';
// Safety level for each water method (QA M-5). Keyed by a phrase in the question.
var LEVEL = [
['sewage: what must','Full multi-barrier treatment: the minimum for sewage-polluted water. Chemicals can still remain.'],
['still remain','Germs: handled by full treatment. Chemicals: not removed at home.'],
['sari','Level 1, pre-filter: reduces some germs. Still disinfect.'],
['biosand','Level 2, filter: removes most germs and dirt when run daily. Still disinfect.'],
['charcoal','Taste only: does not make water safe from germs.'],
['alum','Level 1, clears water only: still needs filtering and disinfecting.'],
['clarifier','Level 1, clears water only: still needs filtering and disinfecting.'],
['SODIS','Level 3, disinfects clear water from most germs. Not for cloudy water.'],
['rolling boil','Level 3, disinfects: the most reliable home method for germs. Does not remove chemicals.'],
['bleach','Level 3, disinfects clear water from most bacteria and viruses. Does not kill Cryptosporidium (CDC); boil if you can.'],
['cloudy water','Level 3 only after level 1 and 2: settle and filter, then chlorinate.'],
['heavy metals','No home method: find another water source.'],
['best order','Full multi-barrier: settle, filter, disinfect.'],
['Clay pot','Level 2, filter: removes most bacteria. Store water covered.'],
['seawater','Distillation removes salt and germs. Boiling kills germs but leaves the salt.'],
['Sphere','Quantity standard, not a treatment method.'],
['spring box','Source protection: keeps germs out. Still treat if unsure.']
];
var C = [
['Water','Water polluted with sewage: what must it go through before anyone drinks it?','Settling, filtering and disinfecting','A cloth strain and nothing else','A night in a clean bucket','Sewage water carries many germs and worms. Use every barrier: settle (or alum or moringa), filter (biosand or ceramic), then boil (best, per CDC) or chlorinate if you cannot boil. Find a cleaner source if you can.',[W('Water purification'),W('Sewage')]],
['Water','After settling, filtering and boiling water that had sewage in it, what risk can still remain?','Chemicals and medicines in it','Germs made by boiling','Extra salt from the filter','Home treatment handles germs. It does not remove fuel, pesticides, metals or medicines that run off with sewage.',[W('Water purification'),W('Water pollution')]],
['Water','In Bangladesh, straining water through an old sari folded several times cut cholera by about how much?','About half','About a tenth','About 90 percent','A 2003 study (Colwell and others) found about 48% less cholera. Cloth catches the tiny animals that carry cholera germs, but the water still needs disinfecting.',[W('Sari filter'),W('Cholera')]],
['Water','In a biosand (slow sand) filter, which layer does most of the germ removal?','The living top layer','The bottom gravel layer','The plastic outlet pipe','A thin living film called the schmutzdecke forms on top of the sand. It traps and eats germs, so the filter must stay wet.',[W('Slow sand filter'),W('Biosand filter')]],
['Water','What does charcoal in a home water filter mainly improve?','Taste, smell and some chemicals','It kills all the bacteria in the water','It takes out the salt','Activated carbon sticks many chemicals to its surface. It does not reliably kill germs, so you still need to disinfect.',[W('Activated carbon')]],
['Water','What does a small dose of alum do to muddy water?','Clumps dirt so it settles','Kills every germ in it','Removes dissolved salt','Alum (aluminum sulfate) makes tiny particles stick together into flocs that sink. Pour off the clear water, then filter and disinfect.',[W('Flocculation'),W('Aluminium sulfate')]],
['Water','Crushed seeds of which tree are used as a natural water clarifier in Africa and Asia?','Moringa','Neem tree leaves','The African baobab','Proteins in moringa seed powder act as a natural coagulant. Like alum, they clear water but do not make it fully safe on their own.',[W('Moringa oleifera')]],
['Water','For solar disinfection (SODIS), how long should clear plastic bottles of water sit in full sun?','At least 6 hours','About 20 minutes','About one full hour','Use clear PET bottles of 2 liters or less. Leave them 2 days if the sky is very cloudy. The water must be clear for SODIS to work.',[W('Solar water disinfection')]],
['Water','What does bringing water to a rolling boil do?','Kills germs, not chemicals','Removes lead and nitrates','Takes out the salt','Boiling kills disease germs. It does not remove chemicals or salt, and long boiling can even concentrate them.',[W('Boiling'),W('Water purification')]],
['Water','EPA emergency guidance: about how much plain 6% household bleach treats 1 liter of clear water?','About 2 drops, wait 30 minutes','About 2 cups, use right away','About 20 drops, wait 1 minute','EPA says 8 drops per gallon (about 2 per liter) of plain, unscented bleach. Wait 30 minutes; the water should smell slightly of chlorine. Chlorine does not kill Cryptosporidium, so boil when you can.',[W('Cryptosporidium'),W('Portable water purification'),W('Water chlorination')]],
['Water','Why should cloudy water be settled and filtered before adding chlorine?','Dirt shields germs and uses up chlorine','Chlorine turns mud poisonous','It makes the water boil faster','Particles hide germs and react with chlorine. Clear water needs less chlorine and the treatment works better.',[W('Water chlorination'),W('Turbidity')]],
['Water','Which household method reliably removes heavy metals and factory chemicals from badly polluted water?','None of them reliably','Boiling for 20 minutes','Sunlight in clear bottles','Settling, filtering and disinfecting deal with germs and dirt. Chemical pollution needs special treatment or a different water source.',[W('Water purification')]],
['Water','What is the best order for treating very dirty water in the field?','Settle, filter, then disinfect','Disinfect, settle, then filter','Filter, disinfect, then settle','This multi-barrier approach is taught by groups like CAWST and WHO. Each step makes the next one work better.',[W('Water purification'),W('Point-of-use water treatment')]],
['Water','Clay pot water filters are often coated with what to help kill bacteria?','Colloidal silver','Plain table salt','Hardwood ash and lime','Ceramic pot filters, made locally in many countries, strain out germs. The silver coating helps kill bacteria.',[W('Ceramic water filter')]],
['Water','Which method can make seawater drinkable?','Distillation','Plain boiling','A charcoal filter','Distillation boils water and collects the steam, leaving the salt behind. Boiling alone leaves the salt in.',[W('Distillation'),W('Desalination')]],
['Water','The Sphere humanitarian standard sets a minimum of about how much water per person per day?','15 liters','1 liter','150 liters','The 15 liters covers drinking, cooking and basic washing in a disaster.',[W('Sphere (organization)')]],
['Water','A spring box or dug well is safer when it is built how?','Sealed with clean runoff away','Left open to sunlight','Lined with wood chips','Covering the well and sloping ground away from it keeps surface runoff and animals out.',[W('Water well'),W('Spring (hydrology)')]],
['Home Chemistry','Lye made by soaking hardwood ashes in water is mostly what chemical?','Potassium hydroxide','Sodium chloride (salt)','Calcium carbonate (chalk)','Pioneers used ash lye, called potash lye, to make soft soap.',[W('Lye'),W('Potash')]],
['Home Chemistry','What does fat plus lye make?','Soap and glycerin','Vinegar and salt','Alcohol and sugar','The reaction is called saponification. Fat or oil and lye must be measured carefully so no harsh lye is left in the soap.',[W('Saponification'),W('Soap')]],
['Home Chemistry','If lye splashes on skin, what should you do first?','Rinse with lots of water','Cover it with butter or grease','Let it dry in the sun','Flush with running water for at least 15 minutes and get medical help for eye splashes. Always wear eye protection and gloves with lye.',[W('Sodium hydroxide')]],
['Home Chemistry','Vinegar forms when bacteria turn what into acetic acid?','Alcohol','Sea salt','Starch from potatoes','Acetobacter bacteria need air. That is why vinegar is made in open crocks covered with cloth.',[W('Vinegar'),W('Acetobacter')]],
['Home Chemistry','Seawater is about 3.5% salt. About how much salt is in 10 liters?','About 350 grams','About 35 grams','About 3.5 kilograms','10 liters of seawater weighs about 10 kg; 3.5% of 10,000 g is 350 g. Salt is made by evaporating the water off.',[W('Seawater'),W('Sea salt')]],
['Home Chemistry','Charcoal is made by heating wood with what?','Very little air','Lots of water','Extra oxygen','With little oxygen, wood does not burn away. Water and gases leave and mostly carbon is left.',[W('Charcoal')]],
['Home Chemistry','Tallow is rendered fat from which animals?','Cattle or sheep','Pigs fed on acorns','Olive trees pressed cold','Lard comes from pigs. Rendering means slowly melting fat and straining it to make it keep.',[W('Tallow'),W('Lard')]],
['Home Chemistry','How is cold-pressed oil made?','Squeezing seeds without high heat','Boiling seeds with lye','Fermenting seeds with yeast','Seeds like sunflower or olives are pressed. Pressing is simpler, but gets less oil than using heat or solvents.',[W('Vegetable oil')]],
['Food and Seeds','Seeds keep longest when stored how?','Cool, dry and dark','Warm and humid','In bright sunlight','Moisture and heat make seeds age fast. Store dry seed in sealed jars in a cool place.',[W('Seed saving')]],
['Food and Seeds','Why save seed from open-pollinated plants rather than hybrid (F1) plants?','Hybrid seed does not grow true','Hybrids never make any seeds','Open-pollinated seed is illegal','Seed from F1 hybrids grows into a mix of different plants. Open-pollinated seed grows plants like the parent.',[W('Seed saving'),W('F1 hybrid')]],
['Food and Seeds','Low-acid foods like green beans and meat must be home canned how, to prevent botulism?','In a pressure canner','In a boiling water bath','In jars left in the sun','Only a pressure canner gets hot enough to kill botulism spores. Water baths are only for high-acid foods like fruit and pickles.',[W('Home canning'),W('Botulism')]],
['Food and Seeds','How does salting preserve meat?','It draws out the water germs need','It cooks the meat all the way','It adds vitamins to the meat','Salt pulls water out by osmosis. Most spoilage bacteria cannot grow without enough water.',[W('Salting (food)')]],
['Food and Seeds','In sauerkraut, which microbes make the acid that preserves it?','Lactic acid bacteria','Acetic acid bacteria','Baker\'s yeast','Salt holds back harmful germs while lactic acid bacteria sour the cabbage, which keeps it from spoiling.',[W('Sauerkraut'),W('Lactic acid bacteria')]],
['Food and Seeds','Which smoking method does NOT cook food, so the food must be cured first?','Cold smoking','Hot smoking','Pit barbecue','Cold smoke stays under about 30 C (86 F). It flavors and dries but does not kill germs by heat.',[W('Smoking (cooking)')]],
['Food and Seeds','Why does dried food resist spoiling?','Germs need water to grow','Sunlight adds salt to it','Drying adds extra sugar','Removing most of the water stops bacteria and molds. Keep dried food sealed from damp air.',[W('Food drying')]],
['Food and Seeds','A root cellar keeps vegetables because it is what?','Cool and humid','Hot and dry','Bright and windy','Underground, the temperature stays near 0 to 4 C (32 to 40 F) with moist air, so roots stay firm for months.',[W('Root cellar')]],
['Food and Seeds','Pemmican, a long-lasting trail food of Native North Americans, is dried meat mixed with what?','Rendered fat','Maple sugar only','Salt water','Dried, pounded meat mixed with fat (and sometimes berries) kept for months. Fur traders relied on it.',[W('Pemmican')]],
['Sanitation','A pit latrine should be at least about how far from a well or spring?','30 meters','3 meters','300 meters','About 30 m is the common guideline (Sphere, WHO), and the pit bottom should be well above the water table.',[W('Pit latrine')]],
['Sanitation','In a ventilated improved pit (VIP) latrine, what traps flies?','A screened vent pipe','A bowl of vinegar','A sticky mat on the floor by the door','Flies go toward light at the top of the vent pipe and are trapped by the screen. The airflow also cuts the smell.',[W('Ventilated improved pit latrine')]],
['Sanitation','In a septic system, where does the liquid go after the tank?','A drain field in the soil','Straight into a creek','Back into the house','Solids settle in the tank. The liquid seeps through gravel trenches where soil and microbes clean it.',[W('Septic tank'),W('Septic drain field')]],
['Sanitation','Why do gravity sewers need a steady downhill slope?','So flow carries solids along','So the pipes stay frozen','So they make electricity','Engineers design for a self-cleansing speed (about 0.6 m per second) so solids do not settle and block pipes.',[W('Sanitary sewer')]],
['Sanitation','In 1854, John Snow traced a London cholera outbreak to what?','A Broad Street water pump','Bad air rising from the swamps','A city bakery','He mapped the deaths and had the pump handle removed. His work helped launch modern public health.',[W('1854 Broad Street cholera outbreak')]],
['Sanitation','Studies find handwashing with soap cuts diarrhea cases by roughly how much?','About 30 percent','About 1 percent','Nearly 100 percent','A 2015 Cochrane review found about a 30% drop in communities. It is one of the cheapest health measures.',[W('Hand washing')]],
['Water Supply','About how much pressure does each 10 meters of water height give at the bottom?','About 1 bar (14.5 psi)','About 10 bar (145 psi)','About 0.01 bar','Pressure = density x gravity x height: 1000 x 9.8 x 10 = about 98,000 pascals, close to 1 bar. That is why water towers are tall.',[W('Hydrostatics'),W('Water tower')]],
['Water Supply','How much does a tank 2 m long, 2 m wide and 1.5 m deep hold?','6,000 liters','600 liters','60,000 liters','2 x 2 x 1.5 = 6 cubic meters, and 1 cubic meter = 1,000 liters.',[W('Cubic metre')]],
['Water Supply','Which pump uses the force of flowing water to lift some water uphill with no fuel?','Hydraulic ram pump','Hand piston pump','Electric centrifugal pump','A ram pump uses the water hammer effect. It lifts a small part of the flow high, running day and night.',[W('Hydraulic ram')]],
['Water Supply','Roman aqueducts moved water mainly by what?','Gravity on a gentle slope','Steam-powered pumps','Animals turning wheels','Some dropped only a few centimeters per 100 meters. The Pont du Gard bridge is a famous example.',[W('Roman aqueduct')]],
['Water Supply','Why are town water mains often laid in loops instead of dead ends?','Water keeps moving and stays fresh','Loops use less pipe','Dead ends make water hot','Looped networks let water reach a home from two directions and avoid stale water in dead ends.',[W('Water distribution system')]],
['Electricity','A 12 volt battery runs a 60 watt light. About how much current flows?','5 amps','720 amps','0.2 amps','Power = volts x amps, so amps = 60 / 12 = 5.',[W('Electric power')]],
['Electricity','A 12 V, 100 amp-hour battery stores about how much energy?','1.2 kilowatt-hours','12 kilowatt-hours','0.12 kilowatt-hours','12 V x 100 Ah = 1,200 watt-hours. Lead-acid batteries should only be drained about halfway to last long.',[W('Ampere-hour'),W('Lead-acid battery')]],
['Electricity','Why must lead-acid batteries charge where there is fresh air?','They can give off explosive hydrogen','They get too cold','They need sunlight to keep the acid charged','Charging splits water into hydrogen and oxygen. Keep sparks and flames away.',[W('Lead-acid battery')]],
['Electricity','Water flowing at 10 liters per second and falling 20 meters carries about how much power before losses?','About 2 kilowatts','About 20 watts','About 200 kilowatts','Power = flow x gravity x height: 10 kg/s x 9.8 x 20 m = about 1,960 W. A small turbine might deliver about half.',[W('Micro hydro'),W('Hydropower')]],
['Electricity','If wind speed doubles, how much does a wind turbine\'s available power go up?','8 times','2 times','4 times','Wind power goes up with the cube of wind speed: 2 x 2 x 2 = 8. That is why turbines go on tall towers in steady wind.',[W('Wind power'),W('Wind turbine')]],
['Electricity','A 100 watt solar panel gets 5 peak sun hours. About how much does it make in a day before losses?','500 watt-hours','100 watt-hours','5,000 watt-hours','100 W x 5 hours = 500 Wh. Real systems lose some to heat, dust, wiring and battery charging.',[W('Solar panel'),W('Solar irradiance')]],
['Electricity','Why must a fuel generator never run indoors or in a garage?','Carbon monoxide can kill','It gets too loud','It uses more fuel indoors than outdoors','Carbon monoxide has no smell. Run generators outside, away from windows, and use CO alarms.',[W('Carbon monoxide poisoning'),W('Engine-generator')]],
['Electricity','What protects a wire from overheating if too much current flows?','A fuse or circuit breaker','A bigger light bulb','Extra electrical tape','The fuse or breaker must match the wire size. A ground wire gives fault current a safe path.',[W('Fuse (electrical)'),W('Circuit breaker')]],
['Roads and Structures','Why are gravel roads built with a crown (higher in the middle)?','So rainwater drains off','To slow down traffic','To use less gravel','Water is a road\'s worst enemy. Crowns, ditches and culverts carry it away before it softens the road base.',[W('Gravel road')]],
['Roads and Structures','How is road base compacted best?','Thin layers, slightly moist','One thick dry layer','Thick, soaked layers','Each layer (often 15 to 20 cm) is packed near its best moisture level. Too dry or too wet will not pack tight.',[W('Soil compaction')]],
['Roads and Structures','What does mixing lime into sticky clay soil under a road do?','Makes it firmer, less sticky','Makes the clay dissolve','Helps grass grow on it to hold it','Lime reacts with clay so it swells less and carries more weight. This is called soil stabilization.',[W('Soil stabilization')]],
['Roads and Structures','Why keep new concrete damp for several days?','It hardens by reacting with water','To wash off extra cement','So it dries out faster','This is called curing. Concrete that dries too fast is weaker and cracks.',[W('Concrete')]],
['Roads and Structures','Roman concrete got much of its strength from what?','Volcanic ash','Steel bars','Plastic fibers','Lime mixed with volcanic ash (pozzolana) made concrete that has lasted 2,000 years, even in seawater.',[W('Roman concrete')]],
['Roads and Structures','Asphalt pavement is stones glued together with what?','Bitumen','Clay','Slaked lime','Bitumen is a sticky black product of crude oil. It is heated, mixed with stone, spread, and rolled flat.',[W('Asphalt concrete'),W('Bitumen')]],
['Roads and Structures','Why do roof trusses and bridges use triangles?','Triangles hold their shape','Triangles let wind through','Triangles look nicer','A triangle cannot change shape unless a side changes length. That makes it stiff under heavy loads.',[W('Truss')]],
['Safety: Recognize and Avoid','What does mixing bleach with ammonia cleaners make?','Toxic chloramine gas','A stronger, safer cleaner','Plain salt water','Never mix cleaners. If exposed, get to fresh air right away and call poison control.',[W('Sodium hypochlorite'),W('Monochloramine')]],
['Safety: Recognize and Avoid','What does mixing bleach with vinegar or acid cleaners release?','Chlorine gas','Pure oxygen','Water vapor only','Even small amounts burn the eyes and lungs. Use one cleaner at a time and rinse between them.',[W('Sodium hypochlorite'),W('Chlorine')]],
['Safety: Recognize and Avoid','Why must grain bins and flour mills control fine dust?','Dust in the air can explode','Dust attracts lightning','Dust makes the stored grain sprout','A cloud of fine flammable dust can explode from a spark. Keep it swept up and keep flames away.',[W('Dust explosion')]],
['Safety: Recognize and Avoid','When diluting strong acid, what is the safe rule?','Add acid slowly to water','Add water fast to acid','Pour both in at once','Adding water to acid can boil and spatter acid. Wear goggles and gloves.',[W('Sulfuric acid')]]
];

// Truth or Lies deck data only. Popular beliefs vs. the fact-based answer. [topic, question, true answer, myth1, myth2, why, [Wikipedia titles]].
var MG = typeof MG !== 'undefined' ? MG : {}; MG.decks = MG.decks || {};
(function () {
var C = [
['Science','Can you see the Great Wall of China from the Moon with your bare eyes?','It is far too narrow','It is the only human-made thing you can see','At night, when it is lit up','The wall is only a few meters wide. Astronauts say it is very hard to see even from low orbit.',['Great Wall of China','List of common misconceptions']],
['Animals','How long can a goldfish remember things?','Months','Three seconds','One minute','Studies show goldfish can be trained and remember for months.',['Goldfish']],
['Animals','What makes a bull charge at a matador\'s cape?','The cape\'s movement','The color red','The cape\'s smell','Bulls are red-green color blind. They charge at the motion of the cape, whatever its color.',['Bull','List of common misconceptions']],
['Science','Can lightning strike the same place twice?','Often','Not in the same spot','In summer, during storms','Tall objects get hit again and again. The Empire State Building is struck about 20 to 25 times a year.',['Lightning']],
['Body','How much of the brain do people really use?','Nearly all of it','Only 10 percent of it','About half, one side at a time','Brain scans show activity in all parts of the brain over a day. The 10% idea is a myth.',['Ten percent of the brain myth']],
['Body','Does sugar make children hyperactive?','Studies find no effect','Within minutes','White sugar does, honey does not','Double-blind studies found no difference in behavior. Parents who believed their child had sugar rated them as more hyper.',['Sugar high']],
['Body','Does cracking your knuckles cause arthritis?','Studies found no link','After ten years','In the thumbs, mostly','The pop comes from gas bubbles in the joint fluid. One doctor cracked one hand\'s knuckles for 60 years and found no arthritis.',['Cracking joints']],
['Body','Does shaving make hair grow back thicker or darker?','Same thickness and color','Much thicker','On the face, not the legs','Cut hair has a blunt tip that can feel coarse, but shaving does not change thickness, color or growth rate.',['Shaving','List of common misconceptions']],
['History','How tall was Napoleon Bonaparte?','About average for his time','Under 5 feet','Over 6 feet tall','He was about 5 feet 7 inches (170 cm). Mixing up French and English inches and British cartoons made him seem short.',['Napoleon complex','Napoleon']],
['History','Did Viking warriors wear horned helmets in battle?','That came from 1800s art','All of them did','Their kings did','No horned battle helmet has ever been found. The idea spread from 1800s costume designs, like for Wagner\'s operas.',['Horned helmet','Vikings']],

      var fbel = document.getElementById('fb'); if (fbel && window.innerHeight < 500 && fbel.scrollIntoView) fbel.scrollIntoView({ block: 'start' });
