// Memory research and method cards (data only). Used for the spaced recall practice and the research notes.
// Every card cites the peer-reviewed study behind it (PubMed or the publisher's DOI page). No Wikipedia or wiki sources.
// Methods covered: spaced recall, retrieval practice, memory palace, link/story, peg, major system, chunking, digit span,
// n-back and dual n-back, face-name, card and number drills (memory athletes), sleep. Research notes state near transfer honestly.
var MG = typeof MG !== 'undefined' ? MG : {}; MG.decks = MG.decks || {};
(function () {
var P = function (id) { return 'https://pubmed.ncbi.nlm.nih.gov/' + id + '/'; }, D = function (d) { return 'https://doi.org/' + d; };
var EBB = 'https://psychclassics.yorku.ca/Ebbinghaus/index.htm', MIL = 'https://psychclassics.yorku.ca/Miller/', FTC = 'https://www.ftc.gov/news-events/news/press-releases/2016/01/lumosity-pay-2-million-settle-ftc-deceptive-advertising-charges-its-brain-training-program';
var CEP = P(16719566), ROE = P(16507066), KAR = P(18276894), DUN = P(26173288), DRE = P(28279356), MAG = P(12483214), ERI = P(7375930), COW = P(11515286), MEL = P(22612437), MEL16 = P(27474138), JAE = P(18443283), AU = P(25102926), RED = P(22708717), SOV = P(28116702), KIR = P(13539317), SIM = P(27697851), DIE = P(20046194);
var BOW = D('10.3758/BF03332778'), ROE80 = D('10.1037/0278-7393.6.5.558'), BUG = D('10.1037/h0025280'), PAT = D('10.1002/acp.2350010405'), HIG = D('10.1002/(sici)1099-0720(199704)11:2<147::aid-acp425>3.3.co;2-p'), MCC = D('10.1037/0278-7393.6.2.145'), YES = D('10.1080/03610738408258543'), CHS = D('10.1016/0010-0285(73)90004-2'), GOB = D('10.1016/s1364-6613(00)01662-4'), ATK = D('10.1037/0278-7393.1.2.126'), BEL = D('10.3102/00346543051002247'), QUR = P(25039085), GRO = P(22423647), KOR = P(18578849), RB11 = P(20951630);
var C = [
// Spaced recall
['Spaced recall','Who first measured the "forgetting curve" by testing himself on nonsense syllables?','Hermann Ebbinghaus','Sigmund Freud of Vienna','Ivan Petrovich Pavlov','Ebbinghaus published Memory in 1885. He found most forgetting happens soon after learning, then slows.',[EBB]],
['Spaced recall','A 2006 review of 317 experiments in 184 articles (Cepeda and others) found that spreading study out over time does what?','Improves long-term memory','Makes no difference','Only helps young children under ten','This is the spacing effect. The best gap grows the longer you want to remember something.',[CEP]],
['Spaced recall','To remember something for a year, how should the gaps between review sessions compare with gaps for a test next week?','Longer gaps work better','Gaps should be the same','Review it all the night before','Cepeda and others (2006, 2008) found the best gap grows with how long you need to keep the memory.',[CEP]],
['Spaced recall','In the Leitner box system, what happens to a card you get wrong?','It goes back to box 1','It moves up one box higher','It is removed from the deck','Sebastian Leitner described it in 1972. Easy cards are seen less often and hard cards more often. This app uses it.',[CEP,DUN]],
['Spaced recall','A big 2013 review of ten study methods (Dunlosky and others) rated which two as "high utility"?','Practice testing and spaced practice','Highlighting and rereading','Summaries and keyword pictures','Highlighting and rereading were rated low utility: they feel useful but add little lasting memory.',[DUN]],
['Spaced recall','Kornell and Bjork (2008) had people learn painters\' styles. Which way of ordering the examples helped more?','Mixing painters together','Studying one painter at a time','Looking at each picture once','Mixing (interleaving) beat blocking, even though most people believed blocking had worked better.',[KOR]],
['Spaced recall','What does good sleep after learning do for memory?','Helps memories set and last','Erases what you learned that day','Changes nothing','Studies reviewed by Diekelmann and Born (2010) show sleep helps consolidate new memories.',[DIE]],
// Retrieval practice
['Retrieval practice','Roediger and Karpicke (2006) found that, compared with rereading, practice testing leads to what?','Better recall a week later','Worse recall a week later','The same recall either way','This is the testing effect, or retrieval practice. Trying to recall strengthens memory more than reading again.',[ROE]],
['Retrieval practice','Karpicke and Roediger (2008) taught Swahili words. What helped most for recall a week later?','Testing words already learned','Restudying words already learned','Dropping words already learned','Repeated testing gave about 80% recall; dropping items from testing cut recall to about 35%, even with restudy.',[KAR]],
['Retrieval practice','Karpicke and Blunt (2011) compared practice recalling with drawing concept maps while studying. Which group did better on a later test?','The recall group','The concept map group','They tied','Students who practiced recalling did better, even on a test that asked them to draw concept maps.',[P(21252317)]],
['Retrieval practice','Why does this app ask you a question before showing the fact again?','Recalling builds memory','Reading is a waste of time','To keep scores secret','Roediger and Butler (2011) review: the act of pulling a memory out makes it easier to find next time.',[RB11]],
// Memory palace
['Memory palace','The method of loci (memory palace) is linked by legend to which Greek poet?','Simonides of Ceos','Homer, the poet of the Iliad','Pindar of Thebes, the poet','Cicero tells the story: after a banquet hall collapsed, Simonides named the guests by remembering where each one sat.',[D('10.2307/1423362')]],
['Memory palace','In a memory palace, where do you "put" the things you want to remember?','Along a familiar route','In alphabetical order','On a blank page','You picture each item, in a vivid way, at a place along a path you know well, like rooms in your home.',[BEL,ROE80]],
['Memory palace','Dresler and others (2017) trained ordinary people in the method of loci for 40 days. What happened?','Word list recall more than doubled','Recall did not change','IQ scores went up 30 points','Recall went from about 26 to about 62 words out of 72 and lasted months. The gain was for remembering lists (near transfer), not IQ.',[DRE]],
['Memory palace','Maguire and others (2003) scanned top memory contestants. What set them apart?','They walked a mental route','They had bigger brains','Higher IQ scores','Their brains and IQ looked ordinary. Nine of the ten used the method of loci, and their brains used areas for places while learning.',[MAG]],
['Memory palace','Qureshi and others (2014) taught medical students the method of loci for endocrinology. What did they find?','Better test scores','Lower test scores','No students would try it','Students who used it scored higher on the topic test than those who did not.',[QUR]],
['Memory palace','Why do memory palace images work better when they are odd, funny or moving?','Odd images stand out','Odd images are shorter','Plain images fade faster in sleep','Vivid, interacting images are easier to find again (Bellezza, 1981; Bugelski, 1968).',[BEL,BUG]],
// Link and story
['Link and story','In the story method, how do you remember a list of words in order?','Join them in a made-up tale','Say them faster each time','Write each one 20 times','Bower and Clark (1969) had people make up stories joining 10 words. Story makers recalled far more, in order.',[BOW]],
['Link and story','Bower and Clark (1969): after learning 12 lists of 10 words, how did story makers compare with plain repeaters at the end?','About 90% vs about 13%','About the same','Story makers did worse','Median recall was about 93% for the story group and about 13% for the control group on the final test.',[BOW]],
['Link and story','Roediger (1980) compared memory methods for recalling items in the right order. Which did well?','Loci, peg and link','Rereading the list aloud','Picturing each item alone','The loci, peg and link methods beat plain rehearsal and single images when order mattered.',[ROE80]],
// Peg system
['Peg system','In the classic rhyming peg list, what word is peg 1?','Bun','Shoe','Tree','One-bun, two-shoe, three-tree, four-door, five-hive. You picture each item with its peg.',[BUG,BEL]],
['Peg system','In the rhyming peg list, what word is peg 7?','Heaven','Sticks','Gate','Six-sticks, seven-heaven, eight-gate, nine-vine, ten-hen.',[BUG,BEL]],
['Peg system','In the rhyming peg list, what word is peg 4?','Door','Hive','Hen','Picture the 4th item stuck on a door, the 5th in a beehive.',[BUG,BEL]],
['Peg system','What is the big plus of a peg list over a story chain?','Jump to any number','It needs no pictures','It works without practice','With pegs you can recall item 8 directly. With a chain you must run through the story from the start.',[BEL,ROE80]],
['Peg system','Bugelski (1968) tested the peg-word method on lists. Learners who used pegs recalled what, compared with controls?','Many more words','Fewer words','The same number of words','Picturing items with peg words gave much better recall of the lists.',[BUG]],
// Major system
['Major system','In the major (phonetic) system, which sound stands for the digit 1?','T or D','S or Z','N','0 = s/z, 1 = t/d, 2 = n, 3 = m, 4 = r, 5 = l, 6 = j/sh/ch, 7 = k/hard g, 8 = f/v, 9 = p/b. Vowels are free.',[PAT,HIG]],
['Major system','In the major system, which digit does the R sound stand for?','4','2','7','Four ends in R. Patton (1987) and Higbee (1997) tested learners using this sound code.',[PAT,HIG]],
['Major system','In the major system, which word stands for 42?','Rain','Moon','Lake','R = 4, N = 2. Moon is 32 (M, N). Lake is 57 (L, K).',[PAT,HIG]],
['Major system','In the major system, which word stands for 71?','Cat','Dog','Bus','K = 7, T = 1. Dog is 17 (D, G). Bus is 90 (B, S).',[PAT,HIG]],
['Major system','In the major system, which word stands for 25?','Nail','Lion','Map','N = 2, L = 5. Lion is 52. Map is 39 (M, P).',[PAT,HIG]],
['Major system','In the major system, which word stands for 94?','Bear','Rope','Fish','B = 9, R = 4. Rope is 49. Fish is 86 (F, SH).',[PAT,HIG]],
['Major system','Higbee (1997) followed people learning the phonetic (major) system. What did novices need most?','Practice to get fast','A high IQ','A photographic memory','Beginners were slow at first. With practice the code became quick, which is when it helps recall numbers.',[HIG]],
// Chunking
['Chunking','What is "chunking"?','Grouping items into bigger units','Repeating one item many times','Saying items out loud backward','Example: a phone number grouped as 619, 555, 0123 is easier to hold than 10 single digits.',[MIL,GOB]],
['Chunking','Classic research (Miller, 1956) put short-term memory span at about how many items?','Seven, plus or minus two','Two, plus or minus one','Twenty five, plus or minus five','Later work by Nelson Cowan (2001) suggests about four chunks when people cannot rehearse or group items.',[MIL,COW]],
['Chunking','Cowan (2001) argued that, without rehearsal or grouping, people hold about how many chunks?','About 4','About 12','About 1','Grouping items into chunks is how people seem to hold more than four.',[COW]],
['Chunking','Chase and Simon (1973) showed chess positions for 5 seconds. Masters recalled real game positions well. What about random boards?','Little better than beginners','Even better than before','They could not see them','Masters had learned chunks from real games. Random pieces broke the chunks, so their edge mostly vanished.',[CHS,GOB]],
// Digit span
['Digit span','After 230 hours of practice, a runner called "SF" raised his digit span from 7 to about 79. What about his span for letters?','It stayed about 6','It also rose to about 79 letters','It dropped to 2','Ericsson, Chase and Faloon (1980). He grouped digits as running times. The skill did not carry over to letters. This is near transfer.',[ERI]],
['Digit span','How did "SF" in the Ericsson study remember long strings of digits?','He coded them as race times','He had a photographic memory','He read them backward','He was a runner and turned groups like 3492 into "3 minutes 49.2 seconds, near a world record mile."',[ERI]],
// N-back and dual n-back
['N-back','In a 2-back task, when do you tap "Match"?','When it matches the one 2 back','When it matches the one before','When it is a new letter','Wayne Kirchner described this kind of task in 1958 to study short-term memory for fast-changing information.',[KIR]],
['N-back','In dual n-back, what two streams do you track at once?','A square\'s place and a spoken letter','Two colors and two shapes','Numbers and music notes','Jaeggi and others (2008) used a square moving on a grid plus spoken letters.',[JAE]],
['N-back','Jaeggi and others (2008) reported gains on a reasoning test after dual n-back. What did later careful trials find?','Mixed or small effects','Large proven IQ gains','That it harmed memory','Redick and others (2013) found no IQ gain with an active control group. Au and others (2015) found a small effect; Melby-Lervag (2016) found none on far transfer.',[JAE,RED,AU,MEL16]],
['N-back','A 2013 review (Melby-Lervag and Hulme) of working memory training found what?','Gains mostly on similar tasks','Large gains in general IQ','No gains on any task','People improve on the trained task and similar ones (near transfer). There was no convincing evidence of far transfer to IQ or reading.',[MEL]],
['N-back','Soveri and others (2017) pooled n-back training studies. Where were the gains biggest?','On n-back tasks themselves','On school grades','On reaction to loud noise','Gains were large on trained n-back tasks, small on other working memory tasks, and very small on general thinking.',[SOV]],
['N-back','In 2016 the US Federal Trade Commission fined the maker of which brain game for unproven claims?','Lumosity','Tetris by Alexey Pajitnov','Minecraft by Mojang','Lumos Labs paid $2 million to settle claims that its games could delay memory decline and boost school and work performance.',[FTC,SIM]],
// Face-name
['Face-name','In the face-name method, what do you link the name to?','A picture tied to a face feature','The person\'s shoe size','The first letter only','Pick a feature (big ears), turn the name into a picture (Baker = bread), and see the bread on the ears. McCarty (1980) found it improved recall.',[MCC]],
['Face-name','Yesavage and others (1984) taught the face-name method to young, middle-aged and older adults. Who gained?','All three age groups','Only the young adults','No one','All groups improved name recall with the imagery method, though older adults scored lower overall.',[YES]],
['Face-name','What is a good first step to remember a new person\'s name?','Say it back and use it','Look away quickly','Guess it later','Repeating the name is retrieval practice. Add a picture link for best results.',[MCC,RB11]],
// Card and number drills
['Card and number drills','How do memory athletes memorize a shuffled deck of cards quickly?','Turn cards into images on a route','Count the red cards only','Stare until it sticks','Each card (or pair) becomes a person or object placed along a memory palace route (Maguire 2003; Dresler 2017).',[MAG,DRE]],
['Card and number drills','Atkinson and Raugh (1975) used the keyword method for Russian words. What happened?','Keyword learners recalled more','Keyword learners recalled less','No one learned any words','Linking a foreign word to a sound-alike English picture helped recall of the meaning.',[ATK]],
['Card and number drills','A 2012 meta-analysis (Gross and others) of memory training in older adults found what?','Training improved memory','Training hurt memory','No study had any effect','Gains were moderate and similar across methods; using several strategies was common.',[GRO]],
['Card and number drills','Do memory athletes in studies have special brains or higher IQs?','No, they trained methods','Yes, all are geniuses','Yes, their brains are larger','Maguire (2003) found ordinary brains and IQs. Dresler (2017) showed ordinary people can reach big gains in weeks.',[MAG,DRE]],
['Card and number drills','Simons and others (2016) reviewed brain-training studies. What did they conclude?','Gains show up on trained tasks','Games prevent dementia','Games raise IQ 20 points','They found good evidence for gains on trained tasks, less on related tasks, and little for everyday thinking.',[SIM]]

  T.nbTap = function () { var N = T.nb; if (N && N.i >= 0 && N.taps.indexOf(N.i) < 0) { N.taps.push(N.i); var el = document.getElementById('nbl'); if (el) el.classList.add('tapped'); setTimeout(function () { if (el) el.classList.remove('tapped'); }, 200); } };
  T.nbEnd = function () { var st = MG.UI.state(), N = T.nb, sc = E.nbackScore(N.seq, 2, N.taps); st.best.nback = Math.max(st.best.nback || 0, sc.pct); MG.UI.save();
    app.innerHTML = '<h1>2-back</h1><div class="card"><h2 id="nbres">Score ' + sc.pct + '%</h2><p>Hits ' + sc.hits + ', missed ' + sc.misses + ', false taps ' + sc.falseAlarms + '.</p><p class="doc">Honest note: n-back practice makes you better at n-back and similar tasks. Reviews (Melby-Lervag and Hulme, 2013) found no convincing gains in general intelligence.</p></div>' + b('nback', 'Play again') + b('memory', 'Back', '', 'back'); };
  // Memory palace
  T.pal = null;
  T.palStart = function (r) { T.pal = { pairs: E.palaceRound(r, MG.palace), i: 0, right: 0, r: r };
    app.innerHTML = '<h1>Memory palace</h1><p>Walk through a home in your mind. Picture each item at its place in a silly, vivid way (eggs cracking on the front door). Study the list, then tap Ready.</p>' + T.pal.pairs.map(function (p, i) { return '<div class="card">' + (i + 1) + '. <b>' + esc(p.place) + '</b>: ' + esc(p.item) + '</div>'; }).join('') + b('palready', 'Ready') + b('memory', 'Back', '', 'back'); };
  T.palAsk = function () { var P = T.pal, p = P.pairs[P.i], others = E.shuffle(P.pairs.filter(function (x) { return x !== p; }), P.r).slice(0, 2).map(function (x) { return x.item; }), ch = E.shuffle([p.item].concat(others), P.r);
    app.innerHTML = '<h1>Memory palace</h1><p>Place ' + (P.i + 1) + ' of ' + P.pairs.length + '</p><div class="card big">' + esc(p.place) + '</div><p>What did you put here?</p>' + ch.map(function (c) { return b('palpick', esc(c), ' data-v="' + esc(c) + '"'); }).join('') + b('memory', 'Quit', '', 'back'); };
  T.palPick = function (v) { var st = MG.UI.state(), P = T.pal; if (v === P.pairs[P.i].item) P.right++; P.i++; if (P.i < P.pairs.length) return T.palAsk();
    st.best.palace = Math.max(st.best.palace || 0, P.right); MG.UI.save();
    app.innerHTML = '<h1>Memory palace</h1><div class="card"><h2 id="palres">' + P.right + ' of ' + P.pairs.length + '</h2><p class="doc">Research: ordinary people trained in the method of loci for 40 days more than doubled their recall of word lists (Dresler and others, 2017).</p></div>' + b('palace', 'Play again') + b('memory', 'Back', '', 'back'); };
})();

<script data-src="ui/ui.js">
// UI: screens, debounced taps, save/resume. Reads decks from MG.decks and logic from MG.E.
(function () {
  var E = MG.E, D = MG.decks.herbs, app = document.getElementById('app'), st, lastTap = 0, lastAct = '', q = null;
  function load() { try { st = E.migrate(localStorage.getItem(E.SAVE_KEY), MG.decks); } catch (e) { st = E.newState(); } }
  function save() { try { localStorage.setItem(E.SAVE_KEY, JSON.stringify(st)); } catch (e) { } }
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };

  function srcs(c) { return '<div class="src">' + c.src.map(function (u) { return '<a href="' + u + '" target="_blank" rel="noopener">' + esc(u.replace('https://www.', '')) + '</a>'; }).join('<br>') + '</div>'; }
  function vocabFb(c) { return '<div class="card"><p id="filled">' + esc(c.q).replace('____', '<b><u>' + esc(c.a) + '</u></b>') + '</p><p><b>' + esc(c.a) + '</b> (' + esc(c.pos) + '): ' + esc(c.def) + '</p><p lang="vi"><b>Tiếng Việt:</b> ' + esc(c.vi) + '</p><p><b>Sources:</b></p>' + srcs(c) + '</div>'; }
  function badge(c) { return (c.level ? '<div class="warn"><b>Safety level:</b> ' + esc(c.level) + '</div>' : '') + (c.record ? '<div class="rec"><b>' + esc(c.record) + '</b>' + (c.dates ? '<br>' + esc(c.dates) : '') + '</div>' : ''); }
  function herbCard(c) { return '<div class="card"><h2>' + esc(c.name) + '</h2><p><i>' + esc(c.latin) + '</i>' + (c.pinyin ? ' | ' + esc(c.pinyin) + (c.nature ? ' (' + c.nature + ')' : '') : '') + '</p><p><b>Body system:</b> ' + esc(c.system) + '</p><p><b>Uses:</b> ' + esc(c.uses) + '</p><p><b>How:</b> ' + esc(c.how) + '</p><div class="warn"><b>Warning:</b> ' + esc(c.caution) + '</div><p class="doc">' + esc(D.doctor) + '</p><p><b>Monographs:</b></p>' + srcs(c) + '</div>'; }
  var S = {
    home: function () { return '<h1>Memory Game</h1><p class="ver" id="ver">' + esc(MG_BUILD.label) + '</p>' + (st.session ? btn('resume', 'Resume ' + esc(MG.decks[st.session.deck || 'herbs'].title) + ' practice<small>Question ' + (st.session.i + 1) + ' of ' + st.session.ids.length + '</small>') : '') + '<div class="grid">' + MG.SECTIONS.map(function (s) { return s.ready ? btn('sec', s.title + '<small>' + s.blurb + '</small>', ' data-id="' + s.id + '"') : btn('soon', s.title + ' (coming soon)<small>' + s.blurb + '</small>', ' data-id="' + s.id + '"', 'soon'); }).join('') + '</div>' + btn('about', 'About and sources'); },
    herbs: function () { var due = E.dueCards(st, D.cards, Date.now()).length; return '<h1>Herbs</h1><p>' + D.cards.length + ' herbs. ' + due + ' due for practice. Right ' + st.stats.right + ', wrong ' + st.stats.wrong + '.</p><p class="doc">' + esc(D.doctor) + '</p><div class="grid">' + btn('start', 'Practice (spaced recall)<small>10 questions, missed herbs come back sooner</small>', ' data-deck="herbs"') + btn('lookup', 'Symptom lookup<small>Pick a problem, see herbs used for it</small>') + btn('browse', 'Browse all herbs<small>' + D.cards.filter(function (c) { return c.set === 'jones'; }).length + ' Dr. Jones herbs plus Chinese herbs</small>') + btn('formulas', 'Dr. Jones combo formulas<small>What goes in each, in our own words</small>') + btn('chinese', 'Chinese herbs: hot and cold') + btn('body', 'Body systems<small>How one problem affects the whole body</small>') + btn('dropped', 'Herbs left out and why') + '</div>' + back(); },
    quiz: function () { var s = st.session; q = s.q; return '<p>Question ' + (s.i + 1) + ' of ' + s.ids.length + '</p><div class="card"><p id="prompt">' + esc(q.prompt) + '</p></div>' + q.choices.map(function (c, i) { return btn('pick', esc(c), ' data-i="' + i + '"'); }).join('') + btn('deck', 'Back', ' data-id="' + ((st.session && st.session.deck) || 'herbs') + '"', 'back'); },
    lookup: function () { return '<h1>Symptom lookup</h1><div class="grid">' + E.allSymptoms(D.cards).map(function (s) { return btn('sym', esc(s), ' data-s="' + esc(s) + '"'); }).join('') + '</div>' + back('herbs'); },
    browse: function () { return '<h1>All herbs</h1><div class="grid">' + D.cards.map(function (c) { return btn('herb', esc(c.name) + '<small>' + esc(c.system) + '</small>', ' data-id="' + c.id + '"'); }).join('') + '</div>' + back('herbs'); },
    chinese: function () { var order = ['hot', 'warm', 'neutral', 'cool', 'cold']; return '<h1>Chinese hot and cold</h1><p>Traditional Chinese medicine sorts herbs by "temperature". Warm herbs are used for cold signs (chills, pale, tired); cool herbs for heat signs (fever, redness, thirst). Adaptogens like ginseng, rhodiola, eleuthero and schisandra are said to help the body handle stress.</p>' + order.map(function (n) { var l = D.cards.filter(function (c) { return c.nature === n; }); return '<div class="card"><b>' + n + ':</b> ' + l.map(function (c) { return esc(c.name) + ' (' + esc(c.pinyin) + ')'; }).join(', ') + '</div>'; }).join('') + back('herbs'); },
    body: function () { return '<h1>Body systems</h1><p>The body works as one. A problem in one system pulls on the others.</p>' + MG.bodySystems.map(function (b) { var l = D.cards.filter(function (c) { return c.system === b[0]; }); return '<div class="card"><b>' + b[0] + '</b><p>' + esc(b[1]) + '</p><p><i>Herbs here:</i> ' + l.map(function (c) { return esc(c.name); }).join(', ') + '</p></div>'; }).join('') + back('herbs'); },
    formulas: function () { return '<h1>Combo formulas</h1><p>Dr. Patrick Jones (HomeGrown Herbalist) sells these blends. Below is what each is for and what is in it. Herbs we left out for safety are marked.</p>' + D.formulas.map(function (f) { return '<div class="card"><b>' + esc(f.name) + '</b><p>For: ' + esc(f.for) + '</p><p>Herbs: ' + f.herbs.map(function (h) { var out = D.dropped.some(function (d) { return d.name.toLowerCase().indexOf(h.toLowerCase()) === 0; }); return esc(h) + (out ? ' (left out, see list)' : ''); }).join(', ') + '</p>' + (f.warn ? '<div class="warn"><b>Warning:</b> ' + esc(f.warn) + '</div>' : '') + srcs({ src: [f.url] }) + '</div>'; }).join('') + back('herbs'); },
    dropped: function () { return '<h1>Left out on purpose</h1>' + D.dropped.map(function (d) { return '<div class="card"><b>' + esc(d.name) + '</b><p>' + esc(d.why) + '</p>' + srcs({ src: [d.src] }) + '</div>'; }).join('') + back('herbs'); },
    deck: function () { var d = MG.decks[curDeck], due = E.dueCards(st, d.cards, Date.now()).length; return '<h1>' + esc(d.title) + '</h1><p>' + d.cards.length + ' cards. ' + due + ' due for practice.</p><p class="doc">' + esc(d.note) + '</p><div class="grid">' + btn('start', 'Practice all (spaced recall)<small>10 questions, missed cards come back sooner</small>', ' data-deck="' + d.id + '"') + d.sets.map(function (x) { var n = d.cards.filter(function (c) { return c.set === x; }).length; return btn('start', 'Practice: ' + esc(x) + '<small>' + n + ' cards' + (d.setNotes && d.setNotes[x] ? '. ' + esc(d.setNotes[x]) : '') + '</small>', ' data-deck="' + d.id + '" data-set="' + esc(x) + '"'); }).join('') + btn('cards', 'Browse all cards and sources', ' data-deck="' + d.id + '"') + '</div>' + back(); },
    cards: function () { var d = MG.decks[curDeck]; return '<h1>' + esc(d.title) + ' cards</h1>' + d.sets.map(function (x) { return '<h2>' + esc(x) + '</h2>' + d.cards.filter(function (c) { return c.set === x; }).map(function (c) { return '<div class="card"><p>' + esc(c.q) + '</p><p><b>' + esc(c.a) + '</b></p>' + badge(c) + '<p>' + esc(c.why) + '</p>' + srcs(c) + '</div>'; }).join(''); }).join('') + btn('deck', 'Back', ' data-id="' + d.id + '"', 'back'); },
    memory: function () { return MG.trainers.menu(st); },
    about: function () { return '<h1>About</h1><p>Memory Game is a family learning app. Herbs are the ones Dr. Patrick Jones (HomeGrown Herbalist) uses most in his formulas, cross-checked with Mrs. Grieve\'s A Modern Herbal, Memorial Sloan Kettering and NIH monographs for uses and warnings. Recommended books for deeper study: David Hoffmann, Medical Herbalism (2003); Rosemary Gladstar, Medicinal Herbs: A Beginner\'s Guide (2012); Matthew Wood, The Earthwise Herbal (2008); Bone and Mills, Principles and Practice of Phytotherapy (2013). Nothing here is medical advice.</p><h2>Herb sources</h2>' + MG.herbSources.map(function (s) { return '<div class="card">' + esc(s[0]) + srcs({ src: [s[1]] }) + '</div>'; }).join('') + '<h2>Other sections</h2><p>No Wikipedia or wiki sites are used anywhere. History cards link to Encyclopaedia Britannica, the US National Archives, the State Department Office of the Historian, museums and university sources; social and history topics are cross-checked with both right- and left-leaning outlets where possible. Survival water safety follows WHO, CDC, EPA and USDA guidance. Truth or Lies links to science agencies, museums and peer-reviewed studies (PubMed and DOI). GRE Vocab links each word to the Cambridge English Dictionary and the vdict.com English-Vietnamese dictionary. Every link was checked on Oct 27, 2026 (tools/linkcheck.js).</p><p>Memory research cards cite the original studies (PubMed, DOI and psychclassics links on each card).</p>' + '<p>Practice uses the Leitner box method of spaced repetition (Leitner, 1972; review in Cepeda et al., 2006, Psychological Bulletin). Questions and answer positions are shuffled every session.</p><p class="ver">' + esc(MG_BUILD.label) + '</p>' + back(); }
  };
  var cur = 'home', extra = '', curDeck = 'herbs';
  // Screen history: each new screen gets a browser history entry, so the phone back gesture goes back one screen.
  var hist = [];
  function show(n, html, fromPop) { cur = n; app.innerHTML = html || S[n](); window.scrollTo(0, 0);
    if (fromPop) return; var top = hist[hist.length - 1], e = { n: n, html: html || null, deck: curDeck };
    if (top && top.n === n && (n === 'quiz' || n === 'trainer')) { hist[hist.length - 1] = e; return; }
    hist.push(e); try { if (hist.length === 1) history.replaceState({ mg: 1 }, ''); else history.pushState({ mg: hist.length }, ''); } catch (er) { } }
  function trainerEntered() { var top = hist[hist.length - 1]; if (top && top.n === 'trainer') return; hist.push({ n: 'trainer' }); try { history.pushState({ mg: hist.length }, ''); } catch (er) { } }
  window.addEventListener('popstate', function () { try { if (MG.trainers) MG.trainers.stop(); if (hist.length > 1) hist.pop(); var p = hist[hist.length - 1]; if (!p || p.n === 'trainer') { hist = []; return show('home'); } curDeck = p.deck || curDeck; show(p.n, p.html, true); } catch (er) { recover(); } });
  function recover() { try { st.session = null; save(); } catch (e) { st = E.newState(); } hist = []; app.innerHTML = ''; show('home'); }
  function startSession(deck, set) { var all = MG.decks[deck].cards.filter(function (c) { return !set || c.set === set; }), r = E.rng(st.seed++), ids = E.pickSession(st, all, Date.now(), r, 10); st.session = { deck: deck, ids: ids, i: 0 }; st.session.q = mk(ids[0]); save(); show('quiz'); }
  function card(deck, id) { return MG.decks[deck].cards.filter(function (c) { return c.id === id; })[0]; }
  function mk(id) { var r = E.rng(st.seed++), dk = (st.session && st.session.deck) || 'herbs', c = card(dk, id); return dk === 'herbs' ? E.question(c, D.cards, r) : E.mcq(c, r); }
  app.addEventListener('click', function (ev) { try { onTap(ev); } catch (er) { recover(); } });
  function onTap(ev) {
    var b = ev.target.closest('[data-act]'); if (!b) return; var a = b.getAttribute('data-act'), d = b.dataset, now = Date.now(); if (now - lastTap < (a === 'digit' ? 120 : 350) && (a === lastAct || a === 'pick' || a === 'next')) return; lastTap = now; lastAct = a;
    if (a === 'formulas' || a === 'home' || a === 'about' || a === 'herbs' || a === 'lookup' || a === 'browse' || a === 'chinese' || a === 'body' || a === 'dropped') return show(a);
    var Tr = MG.trainers; if (Tr && a !== 'digit' && a !== 'undo' && a !== 'nbmatch') Tr.stop();
    if (a === 'memory' || ((a === 'sec' || a === 'deck') && d.id === 'memory')) return show('memory');
    if (a === 'span') { trainerEntered(); return Tr.spanStart(st, E.rng(st.seed++)); }
    if (a === 'digit') { if (Tr.span.typed.length < 30) Tr.span.typed += d.d; document.getElementById('typed').textContent = Tr.span.typed; return; }
    if (a === 'undo') { Tr.span.typed = Tr.span.typed.slice(0, -1); document.getElementById('typed').innerHTML = esc(Tr.span.typed) || '&nbsp;'; return; }
    if (a === 'spandone') { Tr.spanCheck(st); save(); return; }
    if (a === 'nback') { trainerEntered(); return Tr.nbStart(E.rng(st.seed++)); }
    if (a === 'nbmatch') return Tr.nbTap();
    if (a === 'palace') { trainerEntered(); return Tr.palStart(E.rng(st.seed++)); }
    if (a === 'palready') return Tr.palAsk();
    if (a === 'palpick') return Tr.palPick(d.v);
    if (a === 'sec' || a === 'deck') { if (MG.decks[d.id] && d.id !== 'herbs') { curDeck = d.id; return show('deck'); } return show(d.id); }
    if (a === 'cards') { curDeck = d.deck; return show('cards'); }
    if (a === 'soon') { b.querySelector('small').textContent = 'Coming soon. Being built and source checked now.'; return; }
    if (a === 'start') return startSession(d.deck || 'herbs', d.set);
    if (a === 'resume') { if (st.session.answered) return next(); return show('quiz'); }
    if (a === 'herb') return show('herb', herbCard(D.cards.filter(function (c) { return c.id === d.id; })[0]) + back('browse'));
    if (a === 'sym') return show('sym', '<h1>' + esc(d.s) + '</h1>' + E.lookup(D.cards, d.s).map(herbCard).join('') + back('lookup'));
    if (a === 'pick') {
      var s = st.session; if (!s || s.answered) return; var i = +d.i, ok = i === s.q.answer; s.answered = true;
      E.grade(st, s.q.id, ok, Date.now()); save();
      [].forEach.call(app.querySelectorAll('[data-act=pick]'), function (x, j) { x.disabled = true; if (j === s.q.answer) x.className = 'right'; else if (j === i) x.className = 'wrong'; });
      var dk = s.deck || 'herbs', c = card(dk, s.q.id), body = dk === 'herbs' ? herbCard(c) : dk === 'vocab' ? vocabFb(c) : '<div class="card">' + badge(c) + '<p>' + esc(c.why) + '</p><p><b>Sources:</b></p>' + srcs(c) + '</div>';
      app.insertAdjacentHTML('beforeend', '<div id="fb"><h2>' + (ok ? 'Right!' : 'Not quite. It is ' + esc(c.name || c.a) + '.') + '</h2>' + body + btn('next', s.i + 1 < s.ids.length ? 'Next question' : 'Finish') + '</div>');
      var fbel = document.getElementById('fb'); if (fbel && window.innerHeight < 500 && fbel.scrollIntoView) fbel.scrollIntoView({ block: 'start' });
      return;
    }
    if (a === 'next') return next();
  }
  function next() { var s2 = st.session; s2.answered = false; s2.i++; if (s2.i >= s2.ids.length) { st.session = null; save(); return show('done', '<h1>Done!</h1><p>Right ' + st.stats.right + ', wrong ' + st.stats.wrong + ' all time. Missed cards come back first next time.</p>' + btn('deck', 'Back to ' + esc(MG.decks[s2.deck || 'herbs'].title), ' data-id="' + (s2.deck || 'herbs') + '"')); } s2.q = mk(s2.ids[s2.i]); save(); return show('quiz'); }
  load(); try { show('home'); } catch (er) { st = E.newState(); save(); show('home'); }
  MG.UI = { save: save, state: function () { return st; } };
})();

  });
})();
